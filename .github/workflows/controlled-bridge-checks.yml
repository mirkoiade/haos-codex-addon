name: Controlled bridge tests
on:
  push:
    branches: [codex/haos-controlled-mcp-bridge]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build Home Assistant Green (aarch64) image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ha_controlled_bridge
          file: ha_controlled_bridge/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: ha-controlled-mcp-bridge:ci
      - name: Verify packaged ARM64 runtime imports
        run: |
          docker run --rm --platform linux/arm64 --entrypoint sh ha-controlled-mcp-bridge:ci -ec '
            mkdir -p /data
            printf "%s\n" "{\"mcp_access_token\":\"\",\"mcp_allowed_hosts\":[],\"energy_candidate_entity_ids\":[]}" > /data/options.json
            python3 -c "import policy, transactions, bridge; print(\"Packaged ARM64 bridge imports: PASS\")"
          '

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge dependencies
        run: |
          python -m pip install -r ha_controlled_bridge/requirements.txt
          python -m pip install PyYAML
      - name: Validate manifest and no-dangerous-access invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          c = yaml.safe_load(Path('ha_controlled_bridge/config.yaml').read_text())
          assert c['homeassistant_api'] is True
          assert c['ingress'] is True and c['panel_admin'] is True
          assert c['boot'] == 'manual'
          assert c.get('full_access') is not True
          assert c.get('docker_api') is not True
          assert c['ports']['8765/tcp'] is None
          assert not c.get('map')
          print('Manifest and safety defaults: PASS')
          PY
      - name: Smoke-test the MCP SDK transport API
        run: |
          python - <<'PY'
          from mcp.server import MCPServer
          from mcp.server.transport_security import TransportSecuritySettings
          server = MCPServer('smoke-test')
          app = server.streamable_http_app(
              transport_security=TransportSecuritySettings(
                  allowed_hosts=['127.0.0.1:8765'],
                  allowed_origins=[],
              )
          )
          assert app is not None
          PY
      - name: Compile and run bridge tests
        run: |
          python -m py_compile ha_controlled_bridge/policy.py ha_controlled_bridge/transactions.py ha_controlled_bridge/bridge.py
          python -m unittest discover -s ha_controlled_bridge/tests -v
