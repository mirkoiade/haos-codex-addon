name: Controlled bridge tests
on:
  push:
    branches: [codex/haos-controlled-mcp-bridge]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge dependencies
        run: |
          python -m pip install -r ha_controlled_bridge/requirements.txt
          python -m pip install PyYAML
      - name: Validate manifest and no-dangerous-access invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          c = yaml.safe_load(Path('ha_controlled_bridge/config.yaml').read_text())
          assert c['homeassistant_api'] is True
          assert c['ingress'] is True and c['panel_admin'] is True
          assert c['boot'] == 'manual'
          assert c.get('full_access') is not True
          assert c.get('docker_api') is not True
          assert c['ports']['8765/tcp'] is None
          assert not c.get('map')
          print('Manifest and safety defaults: PASS')
          PY
      - name: Compile and run policy tests
        run: |
          python -m py_compile ha_controlled_bridge/policy.py ha_controlled_bridge/bridge.py
          python -m unittest discover -s ha_controlled_bridge/tests -v
