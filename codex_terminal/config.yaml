name: "Codex Terminal - Mirko Safe Preview"
version: "0.1.9"
slug: "codex_terminal"
description: >-
  Experimental Ingress terminal with Codex CLI; Home Assistant config is mounted read-only.
startup: "application"
boot: "manual"
stage: "experimental"
init: false
ingress: true
ingress_port: 7681
panel_icon: "mdi:console"
panel_admin: true
arch:
  - aarch64
  - amd64
  - armv7
map:
  - type: homeassistant_config
    read_only: true
    path: /workspace
options:
  working_directory: "/workspace"
  shell: "/bin/bash"
  startup_mode: "menu"
schema:
  working_directory: "str"
  shell: "str"
  startup_mode: "str"
